// The grid-admin plugin with the grid test data (smartmet-library-grid-files-test)

@include "environment.conf"

# The Redis test database listens on a Unix socket created by smartmet-grid-test-redis,
# which writes its path to this file as REDIS_CONTENT_SERVER_SOCKET

@include "grid/redis/socket.conf"

smartmet :
{
plugin :
{
grid-admin :
{
  authenticationRequired = false;

  readMethodsEnabled = true;
  writeMethodsEnabled = false;

  content-server :
  {
    type = "redis"
    redis :
    {
      address          = "$(REDIS_CONTENT_SERVER_SOCKET)"
      port             = 0
      tablePrefix      = "$(REDIS_CONTENT_SERVER_TABLE_PREFIX)"
      secondaryAddress = ""
      secondaryPort    = 0
      lockEnabled      = false;
    }
  }

  ui :
  {
    url       = "/grid-console"
    directory = "%(DIR)/../../ui"
    viewer    = "/gui"
  }
}
}
}
